<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">kubectl-datapath</title>
  <desc id="desc">Shows where Kubernetes traffic was observed and where matching evidence stopped.</desc>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#5fffd7"/>

  <g transform="translate(96 72) scale(0.5)">
    <rect width="256" height="256" rx="56" fill="#161b22" stroke="#30363d" stroke-width="4"/>
    <g transform="translate(128 128) scale(1.2) translate(-120 -128)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 128H120" stroke="#00d787" stroke-width="10"/>
      <path d="M146 128H168" stroke="#8b949e" stroke-width="6" stroke-dasharray="0.1 9"/>
      <circle cx="50" cy="128" r="16" fill="#00d787"/>
      <circle cx="120" cy="128" r="16" fill="#00d787"/>
      <circle cx="50" cy="128" r="6" fill="#161b22"/>
      <circle cx="120" cy="128" r="6" fill="#161b22"/>
      <circle cx="190" cy="128" r="16" fill="#161b22" stroke="#ffaf00" stroke-width="6"/>
      <path d="M184 122L196 134M196 122L184 134" stroke="#ffaf00" stroke-width="5"/>
    </g>
  </g>

  <text x="256" y="132" fill="#5fffd7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700">kubectl datapath</text>
  <text x="96" y="268" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="600">Where was Kubernetes traffic observed,</text>
  <text x="96" y="328" fill="#f0f6fc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="600">and where did the evidence stop?</text>
  <text x="96" y="386" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28">Credential-free eBPF tracing of the Pod, Service and node datapath.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">
    <path d="M160 500H880" stroke="#00d787" stroke-width="6" stroke-linecap="round"/>
    <path d="M910 500H1090" stroke="#8b949e" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
    <circle cx="160" cy="500" r="18" fill="#00d787"/>
    <circle cx="400" cy="500" r="18" fill="#00d787"/>
    <circle cx="640" cy="500" r="18" fill="#00d787"/>
    <circle cx="880" cy="500" r="18" fill="#00d787"/>
    <circle cx="160" cy="500" r="7" fill="#0d1117"/>
    <circle cx="400" cy="500" r="7" fill="#0d1117"/>
    <circle cx="640" cy="500" r="7" fill="#0d1117"/>
    <circle cx="880" cy="500" r="7" fill="#0d1117"/>
    <circle cx="1120" cy="500" r="18" fill="#0d1117" stroke="#ffaf00" stroke-width="5"/>
    <path d="M1111 491L1129 509M1129 491L1111 509" stroke="#ffaf00" stroke-width="5" stroke-linecap="round"/>
    <text x="160" y="560" fill="#8b949e">connect()</text>
    <text x="400" y="560" fill="#8b949e">src Pod</text>
    <text x="640" y="560" fill="#8b949e">src node</text>
    <text x="880" y="560" fill="#8b949e">dst node</text>
    <text x="1120" y="560" fill="#ffaf00">dst Pod</text>
    <text x="1120" y="592" fill="#ffaf00" font-size="18">no matching evidence</text>
  </g>
</svg>
