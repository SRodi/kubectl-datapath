apiVersion: v1
kind: Namespace
metadata:
  name: kubectl-datapath-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kubectl-datapath-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        datapath.e2e/role: source
      containers:
        - name: frontend
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubectl-datapath-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        datapath.e2e/role: destination
      containers:
        - name: backend
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubectl-datapath-e2e
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
