apiVersion: v1
kind: Namespace
metadata:
  name: kubectl-datapath-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kubectl-datapath-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        datapath.e2e/role: source
      containers:
        - name: frontend
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubectl-datapath-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        datapath.e2e/role: destination
      containers:
        - name: backend
          image: registry.k8s.io/nginx-slim:0.27@sha256:ce45bf76c527594f60b5885555dcc6372b5bc8f3539b36314c22e4e079d88cff
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kubectl-datapath-e2e
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
